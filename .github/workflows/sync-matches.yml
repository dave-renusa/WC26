name: Sync match results from ESPN

# TEMPORARY (branch-only): job swapped for a leaderboard HTML dump so the
# sandbox can read live standings via dispatch-on-this-ref. Reverted after use.

on:
  workflow_dispatch:

jobs:
  dump-leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /leaderboard
        run: |
          set -euo pipefail
          status=$(curl -sS -o page.html -w "%{http_code}" \
            "https://wc26-nine.vercel.app/leaderboard")
          echo "HTTP ${status}"
          echo "--- html ---"
          cat page.html
          echo
          [ "${status}" = "200" ]
